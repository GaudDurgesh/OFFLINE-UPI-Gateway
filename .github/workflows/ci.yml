name: Gateway CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run baseline tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

  integration:
    name: Crypto and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: baseline

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://setup_admin:ci-only-password@127.0.0.1:5432/gateway_ci?sslmode=disable
      DB_CONNECTION_TIMEOUT_MS: "60000"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: setup_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gateway_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setup_admin -d gateway_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate temporary server keys
        run: npm run keys:generate

      - name: Set up fresh test database
        run: npm run db:setup

      - name: Run crypto tests
        run: npm run test:crypto

      - name: Run database tests
        run: npm run test:db

      - name: Prepare HTTP test credentials
        run: npm run ci:setup-http

      - name: Build server for HTTP tests
        run: npm run build

      - name: Run HTTP tests with restricted database access
        timeout-minutes: 5
        env:
          PORT: "8000"
          TEST_BRIDGE_CREDENTIAL_FILE: .keys/ci-bridge.json
        shell: bash
        run: |
          set -euo pipefail

          env -u DATABASE_URL node \
            --env-file=.env.ci.runtime \
            dist/server.js > gateway-ci-server.log 2>&1 &
          server_pid=$!

          cleanup() {
            result=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true

            if [ "$result" -ne 0 ]; then
              cat gateway-ci-server.log
            fi

            return "$result"
          }
          trap cleanup EXIT

          ready=false

          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Server exited before becoming ready."
              exit 1
            fi

            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8000/ready > /dev/null; then
              ready=true
              break
            fi

            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "Server did not become ready."
            exit 1
          fi

          npm run test:http
